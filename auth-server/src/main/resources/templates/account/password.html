<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>修改密码</title>
</head>
<body>
<main>
    <h1>修改密码</h1>

    <p th:if="${passwordChanged}" data-testid="password-change-success">密码已修改</p>
    <p th:if="${errorMessage}" th:text="${errorMessage}" data-testid="password-change-error"></p>

    <form method="post" th:action="@{/account/password}">
        <label for="currentPassword">当前密码</label>
        <input type="password" id="currentPassword" name="currentPassword" required
               autocomplete="current-password">

        <label for="newPassword">新密码</label>
        <input type="password" id="newPassword" name="newPassword" required
               autocomplete="new-password" minlength="8" maxlength="64">

        <button type="submit">保存新密码</button>
    </form>
</main>
</body>
</html>
