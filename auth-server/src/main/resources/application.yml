server:
  port: 9000
  servlet:
    session:
      timeout: 14d
      cookie:
        name: AUTH_SESSION
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: unified-login-auth-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unified_login}
    username: ${DB_USERNAME:unified_login}
    password: ${DB_PASSWORD:unified_login}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
