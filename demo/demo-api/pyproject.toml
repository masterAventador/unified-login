[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-login-demo-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "unified-login-fastapi",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
]

[tool.uv.sources]
unified-login-fastapi = { path = "../../sdk/python-fastapi", editable = true }

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/demo_api"]
