[package]
name = "demo-desktop"
version = "0.1.0"
description = "统一登录桌面端示例"
authors = ["Unified Login Contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "demo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.3"
unified-login-tauri = { path = "../../../sdk/tauri" }

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"
