[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-login-fastapi"
version = "0.1.0"
description = "FastAPI resource-server integration for Unified Login"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/unified_login"]
